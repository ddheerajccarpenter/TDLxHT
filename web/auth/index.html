<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Portal — TDlxHT Android</title>
  <meta name="description" content="Sign in, register, or manage your TDlxHT account. Synchronize tasks, habits, and productivity analytics.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Header (Wireframe: Compact, Quiet Architectural Frame) -->
  <header class="page-container" style="padding-top: 0;">
    <div class="header-frame">
      <a href="/" class="header-brand" aria-label="TDlxHT Home">
        <div class="header-brand-icon">
          <img src="/app-icon.png" alt="TDlxHT Logo" width="28" height="28">
        </div>
        <span>TDlxHT</span>
      </a>

      <div class="header-actions">
        <a href="https://github.com/ddheerajccarpenter/TDLxHT" class="header-link" target="_blank" rel="noopener">GitHub</a>
        <a href="/" class="header-link">Home</a>
        <div class="header-separator"></div>
        <div class="glass-switch-wrapper" aria-label="Theme mode toggle">
          <span class="glass-switch-icon" aria-hidden="true">☀️</span>
          <label class="glass-switch" for="theme-switch-header">
            <input type="checkbox" id="theme-switch-header" class="theme-switch-input" aria-label="Toggle dark/light theme">
            <span class="glass-switch-track lg-glass">
              <span class="glass-switch-thumb lg-glass"></span>
            </span>
          </label>
          <span class="glass-switch-icon" aria-hidden="true">🌙</span>
        </div>
        <a href="https://github.com/ddheerajccarpenter/TDLxHT/releases/download/v2.5.13/TDLxHT.2.5.13.apk" data-apk-download="true" class="btn btn-primary btn-sm">
          Download APK
        </a>
      </div>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-card">

      <!-- Alert Box -->
      <div id="auth-alert" class="alert-box"></div>

      <!-- Logged In Profile View -->
      <div id="user-profile-card" style="display: none; text-align: center;">
        <div class="brand-mark" style="width: 56px; height: 56px; font-size: 1.6rem; margin: 0 auto 18px;">✓</div>
        <h2 style="font-size: 1.6rem; margin-bottom: 6px;">Welcome Back</h2>
        <p id="profile-user-email" style="font-family: var(--font-mono); font-size: 0.92rem; color: var(--accent); margin-bottom: 12px;"></p>
        
        <div style="margin-bottom: 24px;">
          <span id="profile-email-confirmed" class="pill-badge">Checking status...</span>
        </div>

        <div style="background: var(--canvas-soft); padding: 14px 18px; border-radius: var(--radius-sm); border: 1px solid var(--hairline); margin-bottom: 24px; text-align: left;">
          <span class="spec-label">User ID (Supabase UID)</span>
          <div id="profile-user-id" style="font-family: var(--font-mono); font-size: 0.74rem; word-break: break-all; color: var(--text-muted); margin-top: 4px;"></div>
        </div>

        <div class="callback-actions">
          <button id="profile-open-app-btn" class="btn btn-primary btn-lg">
            <span>Open in TDlxHT App</span>
          </button>
          <button id="profile-logout-btn" class="btn btn-outline">
            <span>Sign Out</span>
          </button>
        </div>
      </div>

      <!-- Auth Forms -->
      <div id="auth-forms-container">
        <div class="auth-card-header">
          <h2>TDlxHT Account</h2>
          <p>Access your habits, tasks, and cloud synchronizations.</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Sign In</button>
          <button class="auth-tab" data-tab="register">Register</button>
          <button class="auth-tab" data-tab="forgot">Forgot</button>
        </div>

        <!-- Sign In Form -->
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
            Sign In
          </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" style="display: none;">
          <div class="form-group">
            <label class="form-label" for="register-name">Full Name or Handle</label>
            <input type="text" id="register-name" class="form-input" placeholder="Alex" autocomplete="name">
          </div>
          <div class="form-group">
            <label class="form-label" for="register-email">Email Address</label>
            <input type="email" id="register-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="register-password">Password</label>
            <input type="password" id="register-password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label class="form-label" for="register-confirm-password">Confirm Password</label>
            <input type="password" id="register-confirm-password" class="form-input" placeholder="Repeat password" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
            Create Account
          </button>
        </form>

        <!-- Forgot Password Form -->
        <form id="forgot-form" style="display: none;">
          <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 20px;">
            Enter your email and we'll send a password reset link directly to your inbox.
          </p>
          <div class="form-group">
            <label class="form-label" for="forgot-email">Account Email</label>
            <input type="email" id="forgot-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
            Send Reset Link
          </button>
        </form>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script>
    function updateThemeUI(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("tdlxht-theme", theme);
      localStorage.setItem("tdlxht_theme", theme);
      const headerSwitch = document.getElementById("theme-switch-header");
      if (headerSwitch) {
        headerSwitch.checked = (theme === "dark");
      }
    }
    const initialTheme = localStorage.getItem("tdlxht-theme") || localStorage.getItem("tdlxht_theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    updateThemeUI(initialTheme);
    const headerSwitch = document.getElementById("theme-switch-header");
    if (headerSwitch) {
      headerSwitch.addEventListener("change", (e) => {
        updateThemeUI(e.target.checked ? "dark" : "light");
      });
    }

    // Sync latest version
    fetch('/version.json').then(r => r.json()).then(data => {
      if (data && data.apkUrl) {
        document.querySelectorAll('[data-apk-download="true"]').forEach(el => {
          el.setAttribute('href', data.apkUrl);
        });
      }
    }).catch(() => {});

    // Deep link fallback
    document.querySelectorAll('a[data-deeplink], button[data-deeplink]').forEach(el => {
      el.addEventListener('click', () => {
        setTimeout(() => {
          if (!document.hidden) {
            window.location.href = "https://github.com/ddheerajccarpenter/TDLxHT/releases/latest";
          }
        }, 1500);
      });
    });
  </script>

  <!-- Fixed Bottom Navigation — Liquid Glass Tab Bar (Icons Only) -->
  <aside class="bottom-dock-outer" aria-label="Bottom Navigation Dock">
    <nav class="bottom-dock lg-track lg-track--tabbar lg-track--icons-only" style="--lg-count:4;--lg-index:0;">
      <div class="lg-track__glass lg-glass"></div>

      <a href="/#dashboard" class="dock-tab lg-track__item" data-tab="dashboard" aria-label="Dashboard">
        <div class="dock-tab-icon lg-nav__icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </div>
      </a>

      <a href="/#features" class="dock-tab lg-track__item" data-tab="features" aria-label="Features">
        <div class="dock-tab-icon lg-nav__icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
      </a>

      <a href="/#calculators" class="dock-tab lg-track__item" data-tab="calculators" aria-label="Calculators">
        <div class="dock-tab-icon lg-nav__icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2"/>
            <line x1="8" y1="6" x2="16" y2="6"/>
            <line x1="8" y1="10" x2="10" y2="10"/>
            <line x1="14" y1="10" x2="16" y2="10"/>
            <line x1="8" y1="14" x2="10" y2="14"/>
            <line x1="14" y1="14" x2="16" y2="14"/>
            <line x1="8" y1="18" x2="10" y2="18"/>
            <line x1="14" y1="18" x2="16" y2="18"/>
          </svg>
        </div>
      </a>

      <a href="/#download" class="dock-tab lg-track__item" data-tab="download" aria-label="Download">
        <div class="dock-tab-icon lg-nav__icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </div>
      </a>

      <div class="lg-track__lens lg-glass" data-lg-refract></div>
      <div class="lg-track__select"></div>
    </nav>
  </aside>

  <!-- Liquid Glass Enhancement -->
  <script type="module" src="/js/liquid-glass.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
